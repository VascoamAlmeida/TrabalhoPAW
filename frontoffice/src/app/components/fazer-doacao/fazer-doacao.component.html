<div class="main">
  <h2>Nova Doacao</h2>
  <form [formGroup]="doacaoForm">
    <div class="form-group">
      <label class="col-md-2 col-sm-3 col-xs-12 control-label">Entidade</label>
      <div class="col-md-10 col-sm-9 col-xs-12">
        <h4 class="form-control-static">{{ entidade.name }}</h4>
      </div>
    </div>

    <div class="form-group">
      <label class="col-md-2 col-sm-3 col-xs-12 control-label"
        >Quantidade</label
      >
      <div class="col-md-10 col-sm-9 col-xs-12">
        <input
          class="form-control"
          type="number"
          formControlName="quantidade"
          min="1"
        />
      </div>
    </div>

    <div class="form-group">
      <label class="col-md-2 col-sm-3 col-xs-12 control-label">Pontos estimados</label>
      <div class="col-md-10 col-sm-9 col-xs-12">
        <p class="form-control-static">{{ pontosEstimados }}</p>
      </div>
    </div>

    <div class="form-group">
      <label class="col-md-2 col-sm-3 col-xs-12 control-label"
        >Observacoes</label
      >
      <div class="col-md-10 col-sm-9 col-xs-12">
        <textarea class="form-control" formControlName="observacoes"></textarea>
      </div>
    </div>
    <div class="form-group">
      <a class="btn btn-danger" routerLink="/entidades">Cancel</a>
      <button class="btn btn-success" (click)="createDoacao()">Create</button>
    </div>
  </form>
</div>
