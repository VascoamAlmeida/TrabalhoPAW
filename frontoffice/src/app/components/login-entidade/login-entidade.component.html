<main class="form-signin m-5 d-flex justify-content-center">
  <form>
    <h1 class="h3 mb-5 fw-normal">Login de Entidade</h1>
    <div>
      <label for="email">Email:</label>
      <input
        class="form-control"
        type="text"
        id="email"
        name="email"
        [(ngModel)]="email"
        required
      />

      <label for="password">Password:</label>
      <input
        class="form-control"
        type="password"
        id="password"
        name="password"
        [(ngModel)]="password"
        required
      />
    </div>
    <div class="d-flex justify-content-center">
      <button
        class="btn btn-primary w-50 py-2 mt-5"
        (click)="login()"
        type="submit"
      >
        Login
      </button>
    </div>
    <br />
    <p>Still don´t have an account? <a href="/register-entidade">Apply!</a></p>
  </form>
</main>
