<form (ngSubmit)="register()">
  <h1 class="h3 mb-5 fw-normal">Registo de Entidade</h1>
  <div>
    <label for="name">Name:</label>
    <input
      class="form-control"
      type="text"
      id="name"
      name="name"
      [(ngModel)]="name"
      required
    />

    <label for="email">Email:</label>
    <input
      class="form-control"
      type="text"
      id="email"
      name="email"
      [(ngModel)]="email"
      required
    />

    <label for="localizacao">Localização:</label>
    <input
      class="form-control"
      type="text"
      id="localizacao"
      name="localizacao"
      [(ngModel)]="localizacao"
      required
    />

    <label for="password">Password:</label>
    <input
      class="form-control"
      type="password"
      id="password"
      name="password"
      [(ngModel)]="password"
      required
    />
  </div>
  <div class="d-flex justify-content-center mt-3">
    <button class="btn btn-primary w-50 py-2 mt-5" type="submit">
      Register
    </button>
  </div>
</form>
