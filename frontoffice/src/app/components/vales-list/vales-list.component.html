<div class="container mt-3 mb-4">
  <div class="col-lg-12 mt-4 mt-lg-0">
    <div class="row justify-content-center">
      <div class="col-md-12">
        <div
          class="user-dashboard-info-box table-responsive mb-0 bg-white p-4 shadow-sm"
        >
          <table class="table manage-candidates-top mb-0">
            <thead>
              <tr>
                <th>Name</th>
                <th>Price</th>
                <th class="action text-right">Action</th>
              </tr>
            </thead>
            <tbody>
              <ng-container *ngFor="let vale of vales">
                <tr class="candidates-list">
                  <td class="title">
                    <div class="thumb">
                      <img
                        style="width: 80px; height: 80px"
                        class="img-fluid"
                        [src]="imageUrl"
                        alt=""
                      />
                    </div>
                    <div class="candidate-list-details">
                      <div class="candidate-list-info">
                        <div class="candidate-list-title">
                          <h5 class="mb-0">
                            <a [routerLink]="['/vales', vale._id]">{{
                              vale.name
                            }}</a>
                          </h5>
                        </div>
                      </div>
                    </div>
                  </td>
                  <td>
                    <ul class="list-unstyled mb-0 d-flex">
                      <li class="mr-3">{{ vale.price }} pontos</li>
                    </ul>
                  </td>
                  <td>
                    <ul class="list-unstyled mb-0 d-flex">
                      <button
                        class="mr-3 btn btn-success"
                        (click)="buyVale(vale._id)"
                      >
                        Comprar Vale
                      </button>
                    </ul>
                  </td>
                </tr>
              </ng-container>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
