<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.13.1/css/all.min.css"
  integrity="sha256-2XFplPlrFClt0bIdPgpz8H7ojnk10H69xRqd9+uTShA="
  crossorigin="anonymous"
/>

<div class="container mt-3 mb-4">
  <h2 class="h3">Search Entidades</h2>
  <form (ngSubmit)="onSearch()" class="d-flex">
    <label class="mr-3">Name</label>
    <input
      class="form-control"
      type="text"
      [(ngModel)]="searchOptions.name"
      name="name"
    />
    <label class="mr-3">Localizacao</label>
    <input
      class="form-control"
      type="text"
      [(ngModel)]="searchOptions.localizacao"
      name="localizacao"
    />
    <button class="btn btn-primary" type="submit">Search</button>
  </form>
</div>

<div class="container mt-3 mb-4">
  <div class="col-lg-12 mt-4 mt-lg-0">
    <div class="row justify-content-center">
      <div class="col-md-12">
        <div
          class="user-dashboard-info-box table-responsive mb-0 bg-white p-4 shadow-sm"
        >
          <table class="table manage-candidates-top mb-0">
            <thead>
              <tr>
                <th>Name</th>
                <th>Localizacao</th>
                <th class="action text-right">Action</th>
              </tr>
            </thead>
            <tbody>
              <ng-container *ngFor="let entidade of entidades">
                <tr class="candidates-list">
                  <td class="title">
                    <div class="thumb">
                      <img
                        style="width: 80px; height: 80px"
                        class="img-fluid"
                        [src]="imageUrl + entidade.companyLogo"
                        alt=""
                      />
                    </div>
                    <div class="candidate-list-details">
                      <div class="candidate-list-info">
                        <div class="candidate-list-title">
                          <h5 class="mb-0">{{ entidade.name }}</h5>
                        </div>
                      </div>
                    </div>
                  </td>
                  <td>
                    <ul class="list-unstyled mb-0 d-flex">
                      <li class="mr-3">
                        <h5>{{ entidade.localizacao }}</h5>
                      </li>
                    </ul>
                  </td>
                  <td>
                    <ul class="list-unstyled mb-0 d-flex">
                      <li class="mr-3">
                        <a
                          [routerLink]="['/fazer-doacao', entidade._id]"
                          class="text-primary"
                          data-toggle="tooltip"
                          title=""
                          data-original-title="view"
                          >Fazer doacao</a
                        >
                      </li>
                    </ul>
                  </td>
                </tr>
              </ng-container>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
