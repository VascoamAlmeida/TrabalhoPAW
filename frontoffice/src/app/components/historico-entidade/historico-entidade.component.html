<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.13.1/css/all.min.css"
  integrity="sha256-2XFplPlrFClt0bIdPgpz8H7ojnk10H69xRqd9+uTShA="
  crossorigin="anonymous"
/>

<div class="container mt-3 mb-4">
  <h2 class="mt-5">Doações feitas à sua Entidade</h2>
  <div class="col-lg-12 mt-4 mt-lg-0">
    <div class="row justify-content-center">
      <div class="col-md-12">
        <div
          class="user-dashboard-info-box table-responsive mb-0 bg-white p-4 shadow-sm"
        >
          <table class="table manage-candidates-top mb-0">
            <thead>
              <tr>
                <th>Doador</th>
                <th>Data</th>
                <th>Quantidade</th>
                <th>Estado</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody>
              <tr class="candidates-list" *ngFor="let doacao of doacoes">
                <td class="candidate-list-favourite-time">
                  <span class="candidate-list-time order-1">{{
                    doacao.user
                  }}</span>
                </td>
                <td class="candidate-list-favourite-time">
                  <span class="candidate-list-time order-1">{{
                    doacao.data | date : "yyyy-MM-dd"
                  }}</span>
                </td>
                <td class="candidate-list-favourite-time">
                  <span class="candidate-list-time order-1">{{
                    doacao.quantidade
                  }}</span>
                </td>
                <td class="candidate-list-favourite-time">
                  <span class="candidate-list-time order-1">{{ doacao.estado }}</span>
                </td>
                <td>
                  <button *ngIf="doacao.estado === 'Inicio'" class="btn btn-success btn-sm me-2" (click)="aceitar(doacao._id)">Aceitar</button>
                  <button *ngIf="doacao.estado === 'Inicio'" class="btn btn-danger btn-sm" (click)="cancelar(doacao._id)">Cancelar</button>
                  <button *ngIf="doacao.estado === 'Curso'" class="btn btn-primary btn-sm" (click)="concluir(doacao._id)">Concluir</button>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
